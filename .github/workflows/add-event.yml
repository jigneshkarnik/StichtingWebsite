name: Add Event from Issue

on:
  issues:
    types: [labeled]

jobs:
  add-event:
    if: github.event.label.name == 'new-event'
    runs-on: ubuntu-latest

    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install cloudinary

      - name: Run event automation script
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          CLOUDINARY_CLOUD_NAME: du0lumtob
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
        run: python scripts/add_event_from_issue.py

      - name: Create Pull Request
        id: cpr
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: |
            Add event: ${{ github.event.issue.title }} (issue #${{ github.event.issue.number }})

            Co-authored-by: Copilot <223556219+Copilot@users.noreply.github.com>
          branch: event/${{ github.event.issue.number }}-add-event
          delete-branch: true
          title: "📸 Add Event: ${{ github.event.issue.title }}"
          body: |
            ## 📸 New Event — Issue #${{ github.event.issue.number }}

            This PR was created automatically when the `new-event` label was applied.

            ### Files updated
            | File | Change |
            |------|--------|
            | `events_data.json` | New entry added and sorted newest-first |
            | `cloudinary_event_mapping.json` | New event prepended with all Cloudinary URLs |
            | `events.html` | JSON re-embedded with updated mapping |

            ### Review checklist
            - [ ] Event name, date and venue look correct
            - [ ] Hero image (img1) shows as the card thumbnail
            - [ ] Photo count is as expected
            - [ ] Description reads well on the event card
            - [ ] Event appears at the top of the archive (newest first)

            ---
            Closes #${{ github.event.issue.number }}
          labels: |
            automated
            new-event
          assignees: jigneshkarnik
          reviewers: jigneshkarnik

      - name: Comment on issue
        uses: actions/github-script@v7
        with:
          script: |
            const prUrl = '${{ steps.cpr.outputs.pull-request-url }}';
            const body = prUrl
              ? `✅ Automation complete!\n\nA pull request has been created: ${prUrl}\n\nReview it, then **merge to publish** the event on the website.`
              : '⚠️ The automation ran but no PR was created (the event may already exist). Check the workflow logs.';
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

